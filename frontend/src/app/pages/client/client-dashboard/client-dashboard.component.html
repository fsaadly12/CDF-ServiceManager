<h2>My Requests</h2>

<mat-spinner *ngIf="loading"></mat-spinner>

<table *ngIf="!loading" class="table table-bordered">
  <thead>
    <tr>
      <th>Service</th>
      <th>Description</th>
      <th>Status</th>
      <th>Date</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let r of requests">
      <td>{{ r.service_title }}</td>
      <td>{{ r.description }}</td>
      <td>
        <span class="badge bg-primary">
          {{ r.status }}
        </span>
      </td>
      <td>{{ r.created_at | date:'short' }}</td>
    </tr>
  </tbody>
</table>
